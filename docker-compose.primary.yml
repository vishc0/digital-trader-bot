version: '3.8'

# [PRIMARY NODE] - The Core
# Run this on your main machine (Node 1)
# Must have Tailscale installed.

services:
  # 1. Central Nervous System
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379" # Exposed for remote worker access (Bind to Tailscale IP in prod if possible)
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: always

  # 2. State Manager (Risk & Truth)
  state-manager:
    build:
      context: ./platform/backend/state_manager
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=host.docker.internal # Or local service name if on same net
      - REDIS_PORT=6379
      - MAX_DAILY_LOSS=-500.00
    depends_on:
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 3. Data Handler (Market Feeds)
  data-handler:
    build:
      context: ./platform/backend/data_handler
    ports:
      - "8085:8085"

  # 4. Journaling (Audit Logs)
  journaling-service:
    build:
      context: ./platform/backend/journaling_service
    ports:
      - "8084:8084"

  # 5. API Gateway (The Entry Point)
  api-gateway:
    build:
      context: ./platform/gateway
    ports:
      - "8000:8000"
    environment:
      # Local Services
      - STATE_MANAGER_URL=http://state-manager:8080
      - DATA_HANDLER_URL=http://data-handler:8085
      - JOURNALING_URL=http://journaling-service:8084
      # Remote Worker Services (Update these IPs after Tailscale setup!)
      - STRATEGY_ENGINE_URL=http://${WORKER_NODE_IP}:8081
      - WISDOM_BUILDER_URL=http://${WORKER_NODE_IP}:8082
      - EXTERNAL_INTEL_URL=http://${WORKER_NODE_IP}:8083
      - EXECUTION_URL=http://${WORKER_NODE_IP}:8086
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 6. Frontend
  web-ui:
    build:
      context: ./platform/frontend
    ports:
      - "3000:80"
    environment:
      - API_BASE_URL=http://localhost:8000

volumes:
  redis_data:
