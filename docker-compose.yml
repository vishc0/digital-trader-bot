version: '3.8'

services:
  # Central Brain - Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - trading-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # State Manager - The Brain
  state-manager:
    build:
      context: ./platform/backend/state_manager
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - APP_ID=algo_brain_v1
      - MAX_DAILY_LOSS=-500.00
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - trading-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 3

  # Data Handler - Market Data
  data-handler:
    build:
      context: ./platform/backend/data_handler
      dockerfile: Dockerfile
    ports:
      - "8085:8085"
    environment:
      - PORT=8085
    networks:
      - trading-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8085/health" ]
      interval: 10s
      timeout: 5s
      retries: 3

  # Strategy Engine - Signal Generation
  strategy-engine:
    build:
      context: ./platform/backend/strategy_engine
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
    depends_on:
      - state-manager
      - data-handler
    networks:
      - trading-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/health" ]
      interval: 10s
      timeout: 5s
      retries: 3

  # Wisdom Builder - Learning Engine
  wisdom-builder:
    build:
      context: ./platform/backend/wisdom_builder
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
    depends_on:
      - state-manager
    networks:
      - trading-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8082/health" ]
      interval: 10s
      timeout: 5s
      retries: 3

  # External Intelligence - LLM/Sentiment
  external-intelligence:
    build:
      context: ./platform/backend/external_intelligence
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    networks:
      - trading-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8083/health" ]
      interval: 10s
      timeout: 5s
      retries: 3

  # Journaling Service - Audit Trail
  journaling-service:
    build:
      context: ./platform/backend/journaling_service
      dockerfile: Dockerfile
    ports:
      - "8084:8084"
    environment:
      - PORT=8084
    networks:
      - trading-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8084/health" ]
      interval: 10s
      timeout: 5s
      retries: 3

  # Execution Manager (Broker Connector)
  execution-manager:
    build:
      context: ./platform/backend/execution_manager
      dockerfile: Dockerfile
    ports:
      - "8086:8086"
    environment:
      - PORT=8086
      - EXECUTION_MODE=paper
    depends_on:
      - redis
      - state-manager
      - journaling-service
    networks:
      - trading-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8086/health" ]
      interval: 10s
      timeout: 5s
      retries: 3

  # API Gateway - Service Orchestration
  api-gateway:
    build:
      context: ./platform/gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - STATE_MANAGER_URL=http://state-manager:8080
      - STRATEGY_ENGINE_URL=http://strategy-engine:8081
      - WISDOM_BUILDER_URL=http://wisdom-builder:8082
      - EXTERNAL_INTEL_URL=http://external-intelligence:8083
      - JOURNALING_URL=http://journaling-service:8084
      - EXECUTION_URL=http://execution-manager:8086
      - DATA_HANDLER_URL=http://data-handler:8085
    depends_on:
      - state-manager
      - strategy-engine
      - wisdom-builder
      - external-intelligence
      - journaling-service
      - execution-manager
      - data-handler
    networks:
      - trading-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 3

  # Web UI - Frontend
  web-ui:
    build:
      context: ./platform/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - PORT=80
      - API_BASE_URL=http://api-gateway:8000
    depends_on:
      - api-gateway
    networks:
      - trading-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health || true" ]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  redis_data:

networks:
  trading-network:
    driver: bridge
