steps:
  # 1. Build State Manager (The Brain)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/state-manager', './src/state_manager']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/state-manager']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: ['run', 'deploy', 'state-manager', '--image', 'gcr.io/$PROJECT_ID/state-manager', '--region', 'us-central1', '--allow-unauthenticated', '--vpc-connector', 'redis-connector', '--update-env-vars', 'REDIS_HOST=$_REDIS_HOST']

  # 2. Build Strategy Engine (The Logic)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/strategy-engine', './src/strategy_engine']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/strategy-engine']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: ['run', 'deploy', 'strategy-engine', '--image', 'gcr.io/$PROJECT_ID/strategy-engine', '--region', 'us-central1', '--allow-unauthenticated']

# Parallel execution for speed
timeout: '1200s'
options:
  logging: CLOUD_LOGGING_ONLY

# alternative paths

steps:
  # Build the State Manager (The Brain)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/\$PROJECT_ID/state-manager', './src/state_manager']
  
  # Push to Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/\$PROJECT_ID/state-manager']
  
  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'state-manager'
      - '--image'
      - 'gcr.io/\$PROJECT_ID/state-manager'
      - '--region'
      - 'us-central1'
      - '--vpc-connector'
      - 'redis-connector'
      - '--allow-unauthenticated'
images:
  - 'gcr.io/\$PROJECT_ID/state-manager'
timeout: '1200s'